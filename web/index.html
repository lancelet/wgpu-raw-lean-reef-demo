<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A bioluminescent reef</title>
<style>
  /* The canvas fills the page: the window library styles it so, and gives
     it as many pixels as it covers. */
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #02060b;
    color: #cfe8ee;
    font: 13px system-ui, sans-serif;
  }
  canvas { display: block; background: #000; }
  #about {
    position: fixed;
    left: 12px;
    bottom: 10px;
    opacity: 0.55;
  }
  #about:hover { opacity: 1; }
  a { color: #7fd8e8; }
  #out {
    position: fixed;
    left: 12px;
    top: 10px;
    margin: 0;
    white-space: pre-wrap;
    color: #f0a0a0;
  }
</style>
</head>
<body>
<canvas id="canvas" width="960" height="540"></canvas>
<p id="about">
  A bioluminescent reef, drawn with WebGPU by
  <a href="https://lean-lang.org">Lean</a>, through
  <a href="https://github.com/lancelet/webgpu-raw-lean">the raw WebGPU
  bindings</a> (<a href="https://github.com/lancelet/wgpu-raw-lean-reef-demo">its
  source</a>). F: fullscreen.
</p>
<pre id="out"></pre>
<script>
  // The program prints into the page; Emscripten's script declares `Module`.
  var Module = (() => {
    const out = document.getElementById("out");
    const line = (text) => { out.textContent += text + "\n"; };
    if (!navigator.gpu) line("This browser has no WebGPU.");
    return { print: line, printErr: line };
  })();
</script>
<script src="index.js"></script>
</body>
</html>
